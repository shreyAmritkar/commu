spring:
  application:
    name: engish
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engish}
    username: ${DB_USER:engish}
    password: ${DB_PASSWORD:engish}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    user: ${FLYWAY_USER:${DB_USER:engish}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:engish}}

server:
  port: ${PORT:8080}

engish:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  http:
    trusted-proxies: ${TRUSTED_PROXIES:}          # comma-separated IPs or CIDRs, empty = trust nobody
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    database: ${REDIS_DATABASE:0}
    connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:1000}
    command-timeout-ms: ${REDIS_COMMAND_TIMEOUT_MS:500}
    key-prefix: ${REDIS_KEY_PREFIX:engish}
  rate-limit:
    fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    auth-per-ip: ${RATE_LIMIT_AUTH_PER_IP:10}
    create-per-user: ${RATE_LIMIT_CREATE_PER_USER:6}
    turn-per-user: ${RATE_LIMIT_TURN_PER_USER:20}
    complete-per-user: ${RATE_LIMIT_COMPLETE_PER_USER:6}
    alternative-per-user: ${RATE_LIMIT_ALTERNATIVE_PER_USER:10}
  llm:
    global-max-concurrent: ${LLM_GLOBAL_MAX_CONCURRENT:2}   # 0 disables global control
    lease-seconds: ${LLM_LEASE_SECONDS:30}
    fail-open: ${LLM_GLOBAL_FAIL_OPEN:false}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1:8b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
    temperature: ${OLLAMA_TEMPERATURE:0.7}
    max-output-tokens: ${OLLAMA_MAX_OUTPUT_TOKENS:1600}
    max-concurrent: ${OLLAMA_MAX_CONCURRENT:2}              # per instance
    queue-wait-seconds: ${OLLAMA_QUEUE_WAIT_SECONDS:20}
  notifications:
    max-streams-per-user: ${NOTIFY_MAX_STREAMS_PER_USER:5}
    stream-timeout-minutes: ${NOTIFY_STREAM_TIMEOUT_MINUTES:10}
    heartbeat-seconds: ${NOTIFY_HEARTBEAT_SECONDS:25}
    retention-days: ${NOTIFY_RETENTION_DAYS:30}

logging:
  level:
    root: INFO
org:
  jobrunr:
    database:
      table-prefix: jobrunr.
    background-job-server:
      enabled: ${JOBRUNR_SERVER_ENABLED:true}
      worker-count: ${JOBRUNR_WORKER_COUNT:2}        # keep <= OLLAMA_MAX_CONCURRENT
      poll-interval-in-seconds: 5
      delete-succeeded-jobs-after: 24h
      permanently-delete-deleted-jobs-after: 72h
    dashboard:
      enabled: false
      
      
spring:
  application:
    name: engish
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engish}
    username: ${DB_USER:engish}
    password: ${DB_PASSWORD:engish}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

engish:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1:8b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
    temperature: ${OLLAMA_TEMPERATURE:0.7}

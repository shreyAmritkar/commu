# Optional: PostgreSQL only. Run with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: engish
      POSTGRES_USER: engish
      POSTGRES_PASSWORD: engish
    ports:
      - "5432:5432"
    volumes:
      - engish_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  engish_pg:



# Optional: PostgreSQL only. Run with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: engish
      POSTGRES_USER: engish
      POSTGRES_PASSWORD: engish
    ports:
      - "5432:5432"
    volumes:
      - engish_pg:/var/lib/postgresql/data
volumes:
  engish_pg:
